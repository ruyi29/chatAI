services:
  mysql:
    image: mysql:8.4
    container_name: chatai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: chatai_root
      MYSQL_DATABASE: chatai
      MYSQL_USER: chatai
      MYSQL_PASSWORD: chatai_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

